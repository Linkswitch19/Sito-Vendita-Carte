spring.application.name=cardgames
upload.path=src/main/resources/static/immagini
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Database H2 in modalità file, nella cartella `db/` nella root del progetto
spring.datasource.url=jdbc:h2:file:./db/cards;AUTO_SERVER=TRUE
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.datasource.username=sa
spring.datasource.password=
