<div id="carouselCarte" class="carousel slide carousel-fade" data-bs-ride="carousel" data-bs-interval="10000" th:fragment="slideShow">
  <div class="carousel-indicators">

    <button type="button" data-bs-target="#carouselCarte" data-bs-slide-to="0" class="active" aria-label="Slide 1"></button>
    <button type="button" data-bs-target="#carouselCarte" data-bs-slide-to="1" aria-label="Slide 2"></button>
  </div>
  <div class="carousel-inner">

    <div class="carousel-item active ">
      <img src="/immagini/rinSlideShadow.png" class="d-block w-100" alt="Sfondo Rin">
      <a href="/cartaSingola.html" >
        <img src="/immagini/Rin1.png" alt="Rin Fate" width="200" height="280" class="card-image">
      </a>
    </div>

    <div class="carousel-item">
      <img src="/immagini/chikaWallpaper.jpg" class="d-block w-100" alt="Sfondo Chika">
      <a href="/cartaSingolaChika.html" >
        <img src="/immagini/ChikaCard.png" alt="Chika" width="200" height="280" class="card-image">
      </a>
    </div>

  </div>
  <!--uso la classe carousel e attraveso id gli dico cosa fanno i bottoni-->
  <button class="carousel-control-prev" type="button" data-bs-target="#carouselCarte" data-bs-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Previous</span>

  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#carouselCarte" data-bs-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Next</span>

  </button>
</div>
